name: Update data

on:
  schedule:
    # Every 2 hours (GitHub schedules are in UTC). Perimeters refresh every run;
    # the forecast refreshes when it is more than ~5.5 hours old (about 4x per day).
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force_forecast:
        description: "Refresh the forecast even if it is recent"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch perimeters, GACC boundaries and forecast
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_forecast }}" = "true" ]; then
            python fetch_data.py --force-forecast
          else
            python fetch_data.py
          fi

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
